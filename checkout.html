<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bazar - Checkout</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="checkout">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center"
          href="index.html"
        >
          <img
            src="favicon.svg"
            alt="Bazar logo"
            width="24"
            height="24"
            class="me-2"
          />
          Bazar
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link position-relative" href="cart.html">
                Cart
                <span id="cart-count" class="badge bg-danger ms-1">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="checkout.html">Checkout</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-outline-primary ms-lg-2" href="login.html"
                >Login</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Checkout Form -->
    <main class="py-5">
      <div class="container">
        <h1 class="h3 mb-4">Checkout</h1>
        <div class="row">
          <div class="col-md-7">
            <form id="checkout-form" class="card p-4 shadow-sm">
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" required />
              </div>
              <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea
                  class="form-control"
                  id="address"
                  rows="3"
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email (Optional)</label>
                <input type="email" class="form-control" id="email" />
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Place Order
              </button>
            </form>
          </div>
          <div class="col-md-5 mt-4 mt-md-0">
            <div class="card shadow-sm">
              <div class="card-header">
                <strong>Order Summary</strong>
              </div>
              <div class="card-body">
                <p class="mb-1">
                  Items in cart:
                  <span id="summary-items-count">0</span>
                </p>
                <p class="mb-1">
                  Total:
                  <strong id="summary-total">$0.00</strong>
                </p>
                <p class="text-muted small mb-0">
                  This is a demo checkout. No real payment is processed.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 border-top">
      <div class="container text-center text-muted small">
        &copy; <span id="year"></span> Bazar. All rights reserved.
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
