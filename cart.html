<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bazar - Cart</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="cart">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center"
          href="index.html"
        >
          <img
            src="favicon.svg"
            alt="Bazar logo"
            width="24"
            height="24"
            class="me-2"
          />
          Bazar
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active position-relative" href="cart.html">
                Cart
                <span id="cart-count" class="badge bg-danger ms-1">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="checkout.html">Checkout</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-outline-primary ms-lg-2" href="login.html"
                >Login</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Cart Content -->
    <main class="py-5">
      <div class="container">
        <h1 class="h3 mb-4">Your Cart</h1>
        <div id="cart-empty" class="alert alert-info d-none">
          Your cart is currently empty. Browse our
          <a href="products.html" class="alert-link">products</a> to get
          started.
        </div>
        <div id="cart-content" class="table-responsive d-none">
          <table class="table align-middle">
            <thead>
              <tr>
                <th scope="col">Product</th>
                <th scope="col" class="text-end">Price</th>
                <th scope="col" class="text-center">Quantity</th>
                <th scope="col" class="text-end">Subtotal</th>
                <th scope="col"></th>
              </tr>
            </thead>
            <tbody id="cart-items">
              <!-- Cart items rendered here -->
            </tbody>
            <tfoot>
              <tr>
                <th colspan="3" class="text-end">Total:</th>
                <th class="text-end" id="cart-total">$0.00</th>
                <th></th>
              </tr>
            </tfoot>
          </table>
          <div class="d-flex justify-content-between mt-3">
            <a href="products.html" class="btn btn-outline-secondary"
              >Continue Shopping</a
            >
            <div>
              <button id="clear-cart-btn" class="btn btn-outline-danger me-2">
                Clear Cart
              </button>
              <a href="checkout.html" class="btn btn-primary"
                >Proceed to Checkout</a
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-4 border-top">
      <div class="container text-center text-muted small">
        &copy; <span id="year"></span> Bazar. All rights reserved.
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
